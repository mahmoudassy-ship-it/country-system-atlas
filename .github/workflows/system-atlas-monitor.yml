name: System Atlas health monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/system-atlas-monitor.yml"

permissions:
  contents: read

concurrency:
  group: system-atlas-health-monitor
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: https://system-atlas-api.eufoniadiversity.com/api/health
    steps:
      - name: Check production API and refresh state without notifications
        shell: bash
        run: |
          set -uo pipefail
          if ! response=$(curl --fail --silent --show-error --location \
              --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 \
              "$HEALTH_URL"); then
            echo "::warning::System Atlas health endpoint could not be reached"
            printf '## System Atlas health\n\n⚠️ Health endpoint could not be reached.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          HEALTH_RESPONSE="$response" node <<'NODE'
          const { appendFileSync } = require("node:fs");
          let health;
          try {
            health = JSON.parse(process.env.HEALTH_RESPONSE);
          } catch {
            const message = "Health endpoint did not return JSON";
            console.log(`::warning::System Atlas health check: ${message}`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## System Atlas health\n\n⚠️ ${message}\n`);
            process.exit(0);
          }
          const failures = [];
          if (health.ready !== true) failures.push("API is not ready");
          if (health.freshness !== "current") failures.push(`freshness is ${health.freshness ?? "unknown"}`);
          if (health.degraded === true) failures.push("API reports degraded operation");
          if (health.latestRun?.status !== "succeeded") failures.push(`latest refresh is ${health.latestRun?.status ?? "unknown"}`);
          const target = health.catalogTarget;
          if (!target) failures.push("catalog target is missing");
          for (const field of ["countries", "indicators", "sources"]) {
            if (target && health.liveCounts?.[field] !== target[field]) {
              failures.push(`${field} count is ${health.liveCounts?.[field] ?? "missing"}; expected ${target[field] ?? "missing"}`);
            }
          }
          if ((target?.countries ?? 0) !== 219) failures.push(`country/economy target is ${target?.countries ?? "missing"}; expected 219`);
          if ((target?.indicators ?? 0) < 87) failures.push(`indicator target regressed to ${target?.indicators ?? "missing"}; expected at least 87`);
          if ((target?.sources ?? 0) < 9) failures.push(`source target regressed to ${target?.sources ?? "missing"}; expected at least 9`);
          if (failures.length) {
            const message = failures.join("; ");
            console.log(`::warning::System Atlas health check: ${message}`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## System Atlas health\n\n⚠️ ${message}\n`);
          } else {
            const message = `Healthy: ${health.liveCounts.observations} observations; generated ${health.generatedAt}`;
            console.log(message);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## System Atlas health\n\n✅ ${message}\n`);
          }
          NODE
